<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Daisy Ui CDN-->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />

    <!-- Tailwind CSS CDN-->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- font-awesome CDN-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Inter Font Embed code -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <!-- Geist Font Embed code -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">

    <!-- Favicon -->
    <!-- <link rel="shortcut icon" href="assets/hero-leaf1.png" type="image/x-icon"> -->

    <!-- CSS Link -->
    <link rel="stylesheet" href="style/style.css">
    <title>SwiftCart</title>
</head>
<body>
    <header>
        <nav class="navbar bg-[#ffffff] md:px-8 bg-base-100 sticky top-0 left-0 z-50 shadow-sm ">
            <div class="navbar-start">
                <div class="dropdown">
                    <div tabindex="0" role="button" class="btn  hover:bg-[#d8d8d8] hover:border-[#dedede] hover:shadow-none btn-ghost md:hidden" aria-label="Open menu">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"> 
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h8m-8 6h16" /> </svg>
                    </div>

                    <ul tabindex="0" class="menu menu-sm dropdown-content text-[#4B5563] rounded-box z-1 mt-3 w-52 p-2 shadow">
                        <li><a href="#">Home</a></li>
                        <li><a href="#products">Products</a></li>
                        <li><a href="#about">About</a></li>
                        <li><a href="#contact">Contact</a></li>
                    </ul>
                </div>
                <h2 class="font-bold text-[#4F46E5] text-[1.3rem] md:text-[1.77rem]">SwiftCart</h2>
            </div>

            <div class="navbar-center lg:flex">
                <ul class="hidden md:flex justify-between items-center text-[#4B5563] md:gap-4 md:text-[0.95rem]">
                    <li><a href="#">Home</a></li>
                    <li><a href="#products">Products</a></li>
                    <li><a href="#about">About</a></li>
                    <li><a href="#contact">Contact</a></li>
                </ul>
            </div>

            <div class="navbar-end pr-3"> 
                <div tabindex="0" role="button" class="btn btn-ghost btn-circle">
                    <div class="indicator text-[#374151]">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"> <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" /> </svg>
                        <!-- <span class="badge badge-sm indicator-item">8</span> -->
                    </div>
                </div>
            </div>
        </nav>
        <section class="relative bg-[url('assets/banner-image.jpg')] bg-cover bg-center h-[85vh] flex items-center">
            <div class="absolute inset-0 bg-gradient-to-r from-[#111827]/90 via-[#111827]/70 to-[#111827]/20"></div>
            <div class="relative z-10 max-w-2xl px-8 text-left">
                <h1 class="text-3xl md:text-5xl font-bold text-white mb-4"> Best Collection For You </h1>
                <p class="text-white md:text-lg mb-6"> Discover the latest trends in fashion, electronics, and more. Shop with confidence and style at SwiftCart. </p>
                <a href="#products" class="btn bg-[#4F46E5] hover:bg-[#4338CA] text-white px-6 py-2 border-none shadow-none rounded-md">  Shop Now </a>
            </div>
        </section>
    </header>



    <footer class="">
        <P class="text-center text-white text-[0.8rem] py-6">&copy; </P>
    </footer>

    <!-- JS File -->
    <script src="script/script.js"></script>
</body>
</html>
