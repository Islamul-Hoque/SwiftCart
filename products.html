<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Daisy Ui CDN-->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />

    <!-- Tailwind CSS CDN-->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- font-awesome CDN-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Inter Font Embed code -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <!-- Geist Font Embed code -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">

    <!-- Favicon -->
    <!-- <link rel="shortcut icon" href="assets/hero-leaf1.png" type="image/x-icon"> -->

    <!-- CSS Link -->
    <link rel="stylesheet" href="style/style.css">
    <title>SwiftCart</title>
</head>
    <body class="bg-gray-50 ">

    <!-- Navbar -->
    <div id="navbar" class="sticky top-0 left-0 z-50"></div>

    <main class="max-w-7xl mx-auto px-8 py-12 ">
        <h1 class="text-3xl text-center font-bold mb-6">Our Products</h1>
        <div id="categories" class="flex justify-center flex-wrap gap-3 mb-8"></div>

        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8"></div>

        <!-- Modal -->
        <input type="checkbox" id="product-modal" class="modal-toggle" />
        <div class="modal">
            <div class="modal-box">
                <h3 id="modal-title" class="font-bold text-lg"></h3>
                <img id="modal-image" class="h-48 w-full object-contain my-4" />
                <p id="modal-description" class="py-2 text-gray-600"></p>
                <p id="modal-price" class="font-bold text-[#4F46E5] mt-2"></p>
                <p id="modal-rating" class="text-yellow-500"></p>
                <div class="modal-action">
                    <label for="product-modal" class="btn">Close</label>
                    <button class="btn bg-[#4F46E5] text-white">Buy Now</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div id="footer"></div>

    <script src="script/script.js"></script>
</body>
</html>
